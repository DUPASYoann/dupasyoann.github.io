name: Format portfolio sources
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier site scripts tests package.json PORTFOLIO.md README.md AGENTS.md .github/workflows/deploy.yml .github/workflows/prettier.yml .github/workflows/axe.yml --check
