name: Lighthouse report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the public portfolio
        run: npx --yes lighthouse https://dupasyoann.github.io/ --output=html --output-path=lighthouse-report.html --chrome-flags='--headless --no-sandbox'
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.html
